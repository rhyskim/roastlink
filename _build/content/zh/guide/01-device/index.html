<h1>第1步 — 设备设置</h1>
<p>这一步是告诉 Artisan 从哪里获取温度数据。</p>

<ol class="step-list">
  <li>在 Artisan 中打开 <strong>Config → Device</strong>（快捷键 <code>Ctrl+D</code>）。
    （根据 Artisan 版本，名称可能略有不同。）</li>
  <li>将 <strong>Meter</strong> 设置为 <code>WebSocket</code>。</li>
  <li>在 <strong>Curves</strong> 中勾选 <code>ET</code> 和 <code>BT</code>。</li>
  <li>在 <strong>LCDs</strong> 中同样勾选 <code>ET</code> 和 <code>BT</code>。</li>
</ol>

<div class="callout">
  此对话框的名称可能因 Artisan 版本/语言而异 — 关键是把 <strong>Meter 设置为
  WebSocket</strong>。
</div>
