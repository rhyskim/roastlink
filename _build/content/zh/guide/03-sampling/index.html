<h1>第3步 — 采样</h1>
<p>设置多久检查一次温度，这一步很简单。</p>

<ol class="step-list">
  <li>在 Artisan 中打开 <strong>Config → Sampling</strong>。</li>
  <li>将间隔设置为 <code>2.00 secs</code>。</li>
  <li>勾选 <strong>Keep ON</strong>。</li>
  <li>点击确定。</li>
</ol>

<div class="callout">
  这个对话框没有输入命令的地方是正常的。RoastLink 会在需要时自动刷新温度，所以这一步
  只需设置间隔和 Keep ON 即可。
</div>
