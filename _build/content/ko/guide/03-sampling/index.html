<h1>3단계 — 샘플링</h1>
<p>온도를 얼마나 자주 확인할지 정하는 간단한 단계입니다.</p>

<ol class="step-list">
  <li>Artisan 메뉴에서 <strong>설정 → 견본 추출(Sampling)</strong>을 엽니다.</li>
  <li>주기를 <code>2.00 secs</code>로 설정합니다.</li>
  <li><strong>Keep ON</strong>을 체크합니다.</li>
  <li>확인을 누릅니다.</li>
</ol>

<div class="callout">
  이 창에 명령을 입력하는 칸이 따로 없어도 정상입니다. RoastLink가 필요할 때 온도를
  자동으로 갱신하므로, 이 창에서는 주기와 Keep ON만 설정하면 충분합니다.
</div>
