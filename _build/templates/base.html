<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/$lang/">
      <span class="brand-name">$site_name</span>
    </a>
    <nav class="main-nav">
$nav
    </nav>
    <div class="lang-switch">$lang_switch</div>
  </div>
</header>
<main class="page-content">
$content
</main>
<footer class="site-footer">
  <p>$footer</p>
</footer>

<div class="feedback-widget">
  <form class="feedback-form" id="feedback-form" action="$formspree_endpoint" method="POST"
        data-thanks="$feedback_thanks" data-error="$feedback_error">
    <label for="feedback-message">$feedback_label</label>
    <textarea id="feedback-message" name="message" rows="5" placeholder="$feedback_placeholder"></textarea>
    <button type="submit" class="btn">$feedback_submit</button>
    <p class="feedback-status" hidden></p>
  </form>
</div>

<script>
(function () {
  // Feedback widget: AJAX submit (Formspree supports Accept: application/json)
  // so sending feedback never navigates the visitor away from whatever page
  // they were reading.
  var form = document.getElementById('feedback-form');
  if (form) {
    var feedbackTextarea = form.querySelector('#feedback-message');
    if (feedbackTextarea) {
      feedbackTextarea.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      });
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var status = form.querySelector('.feedback-status');
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function (res) {
        status.hidden = false;
        status.textContent = res.ok ? form.dataset.thanks : form.dataset.error;
        if (res.ok) {
          form.reset();
        }
      }).catch(function () {
        status.hidden = false;
        status.textContent = form.dataset.error;
      });
    });
  }

  // Guide page sticky table of contents: highlight whichever section is
  // currently in view, Notion-style. A no-op on any page without a
  // ".guide-toc-sticky" (querySelectorAll just returns an empty list), so
  // this can live in the shared template without a per-page conditional.
  var tocLinks = document.querySelectorAll('.guide-toc-sticky a');
  var sections = document.querySelectorAll('.guide-body section[id]');
  if (tocLinks.length && sections.length) {
    var setActive = function (id) {
      tocLinks.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
      });
    };
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          setActive(entry.target.id);
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    sections.forEach(function (s) {
      observer.observe(s);
    });
  }
})();
</script>
</body>
</html>
